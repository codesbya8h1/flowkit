[project]
name = "flowkit"
version = "0.1.0"
description = "A gated Cursor and Claude coding workflow. Python owns the order; models do one job each; a human approves the plan, the diff, and the review."
requires-python = ">=3.11"
readme = "README.md"
authors = [{ name = "Flowkit" }]

[project.scripts]
flowkit = "flowkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
flowkit = ["prompts/*.md", "templates/**/*"]
